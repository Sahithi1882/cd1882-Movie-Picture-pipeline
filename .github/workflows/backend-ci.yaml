name: Backend CI

on:
  push:
    paths:
      - 'starter/backend/**'
  pull_request:
    paths:
      - 'starter/backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install & Test Backend
        run: |
          cd starter/backend
          pip install -r requirements.txt
          pytest